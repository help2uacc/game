name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release (and tag) with this name, e.g. v1.0.0. Leave empty for an artifact-only build."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot editor and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q editor.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d templates_extract
          mv templates_extract/templates/* "$tdir/"
          ls "$tdir"

      - name: Configure Godot editor settings (Android SDK / JDK)
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk" ]; then echo "Android SDK not found"; exit 1; fi
          echo "Android SDK: $sdk"
          ls "$sdk/build-tools" || true
          minor="$(echo "$GODOT_VERSION" | cut -d. -f1-2)"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${minor}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-${minor}.tres"
          cat "$HOME/.config/godot/editor_settings-${minor}.tres"

      - name: Generate debug keystore
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$ks" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Headless import
        run: |
          mkdir -p build
          "$GODOT" --headless --import 2>&1 | tee build/import.log
          if grep -E "ERROR|SCRIPT ERROR|Parse Error" build/import.log; then exit 1; fi

      - name: Tests
        run: |
          "$GODOT" --headless -s tests/run_tests.gd
          python3 tools/validate_maps.py

      - name: Export debug APK
        run: |
          "$GODOT" --headless --export-debug "Android" build/block_brawl.apk 2>&1 | tee build/export.log
          if [ ! -f build/block_brawl.apk ]; then
            echo "::error::APK was not produced"
            exit 1
          fi
          ls -la build/block_brawl.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: block_brawl-apk
          path: build/block_brawl.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/block_brawl.apk --clobber
          else
            gh release create "$tag" build/block_brawl.apk --target "$GITHUB_SHA" \
              --title "Block Brawl $tag" \
              --notes "Debug-signed Android APK built with Godot ${GODOT_VERSION}. Install: enable 'Install unknown apps' and open block_brawl.apk."
          fi
